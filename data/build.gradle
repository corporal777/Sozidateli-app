plugins {
    alias(libs.plugins.com.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.com.google.dagger.hilt)
    alias(libs.plugins.ksp)
}

android {
    namespace 'com.examle.data'
    compileSdk 35

    defaultConfig {
        minSdk 28

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    Properties properties = new Properties()
    properties.load(project.rootProject.file("local.properties").newDataInputStream())

    buildTypes {
        release {
            minifyEnabled false
            debuggable false

            buildConfigField("String", "SHARE_URL", properties.getProperty("SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("API_URL"))
        }
        beta {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("BETA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("BETA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("BETA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
        "new" {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("ALFA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("ALFA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("ALFA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation project(':common')
    implementation project(':domain')

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material

    implementation libs.retrofit2
    implementation libs.retrofit2.converter.gson
    implementation libs.retrofit2.adapter.rxjava
    implementation libs.retrofit2.kotlin.coroutines.adapter
    implementation libs.okhttp3.logging.interceptor

    implementation(libs.dagger.hilt.android)
    ksp(libs.dagger.hilt.compiler)

    implementation(libs.androidx.room)
    implementation(libs.androidx.room.rxjava2)
    ksp(libs.androidx.room.compiler)

    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}