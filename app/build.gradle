plugins {
    alias(libs.plugins.com.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.kotlin.parcelize)
    alias(libs.plugins.kotlin.plugin.compose)
    alias(libs.plugins.navigation.safeargs)
    alias(libs.plugins.firebase.crashlytics)
    alias(libs.plugins.gms.google.services)
    id 'kotlin-kapt'
    alias(libs.plugins.com.google.dagger.hilt)
    alias(libs.plugins.ksp)
}


android {
    namespace 'com.example.app'
    compileSdk 35
    defaultConfig {
        applicationId "ru.houseofapps.sozidateli"
        minSdk 24
        targetSdk 34
        versionCode 70
        versionName "1.0.42"

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables { useSupportLibrary true }
    }


    signingConfigs {
        release {
            storeFile file("fond.jks")
            storePassword "fondkeystore"
            keyAlias "fondalias"
            keyPassword "fondaliaskey"
        }
    }

    defaultConfig {
        signingConfig signingConfigs.debug

        applicationVariants.configureEach { variant ->
            def buildType = variant.buildType.name + ""
            variant.outputs.configureEach {
                outputFileName = "sozidateli-${buildType}-${variant.versionName}($variant.versionCode).apk"
            }
        }

        manifestPlaceholders = [
                VKIDClientID: "51817061",
                VKIDClientSecret: "ZPcUM4IDxpFP26ych1qA",
                VKIDRedirectHost: "vk.com",
                VKIDRedirectScheme: "vk51817061"
        ]
    }

    Properties properties = new Properties()
    properties.load(project.rootProject.file("local.properties").newDataInputStream())

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.hasProperty("release")) signingConfig signingConfigs.release

            buildConfigField("String", "SHARE_URL", properties.getProperty("SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("API_URL"))
        }
        beta {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("BETA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("BETA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("BETA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
        "new" {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("ALFA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("ALFA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("ALFA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
    }

    variantFilter { variant ->
        if (variant.name == "debug") setIgnore(true)
    }

    lintOptions {
        abortOnError false
        lintConfig file("../lint.xml")
    }

    buildFeatures {
        dataBinding true
        viewBinding true
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.1'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}


