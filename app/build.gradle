apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'
apply plugin: 'androidx.navigation.safeargs'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'

android {
    namespace 'com.example.app'
    compileSdk 34
    defaultConfig {
        applicationId "ru.houseofapps.sozidateli"
        minSdk 24
        targetSdk 34
        versionCode 70
        versionName "1.0.42"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        dataBinding = true
        viewBinding = true
    }


    defaultConfig {
        signingConfig signingConfigs.debug

        applicationVariants.configureEach { variant ->
            def buildType = variant.buildType.name + ""
            variant.outputs.configureEach {
                outputFileName = "sozidateli-${buildType}-${variant.versionName}($variant.versionCode).apk"
            }
        }

        manifestPlaceholders = [
                VKIDClientID: "",
                VKIDClientSecret: "",
                VKIDRedirectHost: "",
                VKIDRedirectScheme: ""
        ]
    }

    Properties properties = new Properties()
    properties.load(project.rootProject.file("local.properties").newDataInputStream())

    signingConfigs {
        release {
            storeFile file(properties.getProperty("STORE_FILE"))
            storePassword properties.getProperty("STORE_PASSWORD")
            keyAlias properties.getProperty("KEY_ALIAS")
            keyPassword properties.getProperty("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingConfigs.hasProperty("release")) signingConfig signingConfigs.release

            buildConfigField("String", "SHARE_URL", properties.getProperty("SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("API_URL"))
        }
        beta {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("BETA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("BETA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("BETA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
        "new" {
            initWith(debug)
            buildConfigField("String", "SHARE_URL", properties.getProperty("ALFA_SHARE_URL"))
            buildConfigField("String", "SOCKET_URL", properties.getProperty("ALFA_SOCKET_URL"))
            buildConfigField("String", "NEW_API_URL", properties.getProperty("ALFA_API_URL"))
            matchingFallbacks = ['debug', 'release']
        }
    }


    variantFilter { variant ->
        if (variant.name == "debug") setIgnore(true)
    }

    lintOptions {
        abortOnError false
        lintConfig file("../lint.xml")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}


dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':qrcodegenerator')
    implementation project(':calendarpager')

    //socket
    implementation('io.socket:socket.io-client:1.0.0') {
        exclude group: 'org.json', module: 'json'
    }

    // support
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation "androidx.activity:activity-ktx:1.7.2"

    // google
    implementation platform('com.google.firebase:firebase-bom:31.1.1')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-perf-ktx'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.maps.android:android-maps-utils:0.4'

    // navigation
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    // Paging
