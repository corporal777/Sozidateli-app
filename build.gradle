// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.gradle_version = '3.3.2'
    ext.kotlin_version = '1.3.21'
    ext.leakcanary_version = '1.5.4'
    ext.dagger_version = '2.19'
    ext.nav_version = '1.0.0-rc02'
    ext.moxy_version = '1.5.3'
    ext.paging_version = '2.1.0'
    ext.retrofit_version = '2.3.0'

    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "android.arch.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath 'com.google.gms:google-services:4.2.0'
        classpath 'com.android.tools.build.jetifier:jetifier-processor:1.0.0-beta02'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
        maven {
            url uri('libs/mint-plugin-repo-5.2.4')
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
