// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.gradle_version = '3.6.3'
    ext.kotlin_version = '1.4.10'
    ext.leakcanary_version = '1.6.3'
    ext.dagger_version = '2.21'
    ext.nav_version = '2.2.2'
    ext.moxy_version = '1.5.3'
    ext.paging_version = '2.1.2'
    ext.retrofit_version = '2.5.0'
    ext.room_version = '2.2.1'

    repositories {
        google()
        jcenter()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${gradle_version}"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.3.0'
        classpath 'com.google.firebase:perf-plugin:1.3.2'
        classpath 'com.google.gms:google-services:4.3.4'
        classpath 'com.dicedmelon.gradle:jacoco-android:0.1.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id "org.sonarqube" version "2.7"
}

allprojects {
    repositories {
        google()
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

sonarqube {
    androidVariant 'fullDebug'
    properties {
        property "sonar.java.coveragePlugin", "jacoco"
    }
}