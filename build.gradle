buildscript {
    ext.agp_version = '8.6.0'
    ext.kotlin_version = '1.9.0'
    ext.dagger_version = '2.50'
    ext.nav_version = '2.5.2'
    ext.moxy_version = '2.2.2'
    ext.paging_version = '2.1.2'
    ext.retrofit_version = '2.9.0'
    ext.room_version = '2.5.2'
    ext.markwon_version = '4.6.2'

    repositories {
        google()
        jcenter()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.2'
        classpath 'com.google.firebase:perf-plugin:1.4.2'
        classpath 'com.google.gms:google-services:4.3.14'
    }
}
allprojects {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://artifactory-external.vkpartner.ru/artifactory/vkid-sdk-andorid/" }
    }
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
